<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- The staggered pair of bare footprints that FootprintMark.drawPair()
       draws procedurally, generated from the same normalised geometry (one
       right foot in a 44x100 box; the left is that mirrored) so the store
       icon and the in-app mark cannot drift apart.

       Only rects and circles: the Connect IQ resource compiler rasterises
       this SVG at build time and supports a small subset of SVG, so no
       strokes, gradients, paths or transforms. -->
  <rect width="240" height="240" rx="44" fill="#17181A"/>

  <!-- Trailing left foot. -->
  <rect x="52.6" y="89.2" width="58.6" height="41.0" rx="19.1" fill="#F2A93C"/>
  <rect x="54.1" y="122.9" width="36.6" height="49.8" rx="17.6" fill="#F2A93C"/>
  <rect x="61.4" y="161.0" width="41.0" height="41.0" rx="19.1" fill="#F2A93C"/>
  <circle cx="100.9" cy="74.6" r="11.0" fill="#F2A93C"/>
  <circle cx="83.4" cy="69.4" r="7.6" fill="#F2A93C"/>
  <circle cx="70.2" cy="73.1" r="6.6" fill="#F2A93C"/>
  <circle cx="60.6" cy="79.7" r="5.7" fill="#F2A93C"/>
  <circle cx="54.8" cy="87.8" r="4.7" fill="#F2A93C"/>

  <!-- Leading right foot. -->
  <rect x="128.8" y="65.8" width="58.6" height="41.0" rx="19.1" fill="#F2A93C"/>
  <rect x="149.3" y="99.5" width="36.6" height="49.8" rx="17.6" fill="#F2A93C"/>
  <rect x="137.6" y="137.6" width="41.0" height="41.0" rx="19.1" fill="#F2A93C"/>
  <circle cx="139.1" cy="51.1" r="11.0" fill="#F2A93C"/>
  <circle cx="156.6" cy="46.0" r="7.6" fill="#F2A93C"/>
  <circle cx="169.8" cy="49.7" r="6.6" fill="#F2A93C"/>
  <circle cx="179.4" cy="56.2" r="5.7" fill="#F2A93C"/>
  <circle cx="185.2" cy="64.3" r="4.7" fill="#F2A93C"/>
</svg>
